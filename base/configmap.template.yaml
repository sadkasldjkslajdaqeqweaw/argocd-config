apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP_NAME}-config  # ConfigMap 名称变量
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
data:
  application.yml: |
    server:
      port: 8080
    spring:
      datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}  # 数据库连接变量
        driver-class-name: com.mysql.cj.jdbc.Driver
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <appender name="FILE" class="ch.qos.logback.core.FileAppender">
        <file>/(${APP_NAME}/logs/app.log</file>
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n</pattern>
        </encoder>
      </appender>
      <root level="${LOG_LEVEL}">  # 日志级别变量（如 INFO）
        <appender-ref ref="FILE" />
      </root>
  JVM_OPTS: "${JVM_OPTS_VALUE}"  # JVM 参数变量（如 -Xms2g -Xmx4g）
  config-hash: "${CONFIG_HASH}"  # 配置哈希变量（用于检测变更）